<head>

<style>
:root{--navy:#0B1F44;--blue:#1747C9;--blue2:#0F3399;--ice:#7FA2FF;--soft:#A9B8D6;--bg:#F3F5F8;--ink:#0A1A33;--muted:#5A6B85;--line:#E7ECF4;--chip:#E3EAF8;--red:#C8102E;--redbg:#FFE9EA;--green:#0E7A3E;--greenbg:#E3F5EA;--card:#FFFFFF;--sh:0 10px 30px rgba(10,26,51,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E9EDF3;color:var(--ink);font-family:Manrope,system-ui,sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.view{padding-bottom:120px}
.hero{background:var(--navy);border-radius:0 0 36px 36px;padding:calc(16px + env(safe-area-inset-top)) 20px 22px;color:#fff;position:relative;overflow:hidden}
.hero .rings{position:absolute;right:-110px;top:-110px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,.06);box-shadow:0 0 0 40px rgba(255,255,255,0),0 0 0 41px rgba(255,255,255,.06),0 0 0 80px rgba(255,255,255,0),0 0 0 81px rgba(255,255,255,.06);pointer-events:none}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.col{display:flex;flex-direction:column}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--ice);text-transform:uppercase}
.h1{margin:0;font-size:36px;line-height:1;font-weight:800;letter-spacing:-1.3px}
.sub{font-size:13px;color:var(--soft)}
.pill{height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex-shrink:0}
.iconbtn.light{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:var(--sh)}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#FF5A5F}
.avatar{width:40px;height:40px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.wrap{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--sh)}
.card.tight{padding:12px 14px}
.card.blue{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(23,71,201,.28)}
.card.navy{background:var(--navy);color:#fff}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.card.blue .lbl{color:#C9D7FF}
.big{font-size:26px;font-weight:800;letter-spacing:-.6px}
.unit{font-size:12px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
a.card,button.card{text-decoration:none;color:inherit;border:none;text-align:left;cursor:pointer;font:inherit}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:rgba(255,255,255,.08);border-radius:16px;padding:4px}
.seg button{height:42px;border-radius:12px;border:none;background:transparent;color:var(--soft);font-weight:800;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy)}
.seg.light{background:var(--chip)}
.seg.light button{color:var(--muted)}
.seg.light button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(10,26,51,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:19px;border:none;background:var(--chip);color:var(--navy);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.on{background:var(--blue);color:#fff}
.btn{height:52px;border-radius:18px;border:none;background:var(--navy);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 18px;text-decoration:none;width:100%}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.btn.soft{background:var(--chip);color:var(--navy)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{height:44px;border-radius:14px;font-size:13px}
.btn:disabled{opacity:.5}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px}
.item .t{font-size:15px;font-weight:800}
.item .m{font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0}
.ring{position:relative;flex-shrink:0}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.tl{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:14px}
.tl .rail i{width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #DCE5FB;margin-top:18px;flex-shrink:0}
.tl .rail b{flex:1;width:2px;background:#DCE3EF}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(86px + env(safe-area-inset-bottom));padding:0 8px calc(10px + env(safe-area-inset-bottom));background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(10,26,51,.08);display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav a{width:62px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.nav a.on{color:var(--blue);font-weight:800}
.nav .plus{width:60px;height:60px;margin-top:-34px;border-radius:22px;background:var(--navy);color:#fff;box-shadow:0 10px 22px rgba(11,31,68,.35);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(10,26,51,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#C9D2E0;margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.6px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:15px;font-weight:600;color:var(--ink);outline:none;width:100%}
.field textarea{height:80px;padding:12px 14px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.toggle{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.sw{width:52px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sw span{width:48px;height:28px;border-radius:14px;background:#C9D2E0;position:relative;display:block;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-pressed="true"] span{background:var(--blue)}
.sw[aria-pressed="true"] span::after{left:23px}
.ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(10,26,51,.3);max-width:88%;text-align:center}
.banner{background:#FFF6DB;color:#6B4E00;border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.4}
.result{display:flex;gap:12px;align-items:center}
.result img{width:72px;height:72px;border-radius:14px;object-fit:contain;background:#F1F3F7;flex-shrink:0}
.price{font-size:18px;font-weight:800;white-space:nowrap}
.badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--greenbg);color:var(--green);white-space:nowrap}
.gauge{background:#fff;border-radius:22px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
.gauge .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:5px;background:var(--blue);border-radius:3px}
.truck-img{position:relative;z-index:2;display:block;width:calc(100% - 28px);max-width:420px;margin:-118px auto 0;filter:drop-shadow(0 18px 18px rgba(10,26,51,.22))}
.truck-shadow{position:relative;height:0}
.hero.home{padding-bottom:132px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.small{font-size:12px;color:var(--muted);line-height:1.45}
a{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<div id="app"></div>
<div id="sheet-root"></div>
<script>
/* ======================= CÁLCULOS COMPARTIDOS CON EL BACKEND ======================= */
var TIPOS_SERVICIO = {
  aceite: 'Aceite y filtro',
  llantas: 'Rotación de llantas',
  frenos: 'Frenos',
  filtro_aire: 'Filtro de aire',
  liquido_frenos: 'Líquido de frenos',
  bujias: 'Bujías',
  bateria: 'Batería',
  anticongelante: 'Anticongelante',
  transmision: 'Aceite de transmisión',
  alineacion: 'Alineación y balanceo',
  otro: 'Otro'
};
/* =================== CÁLCULOS (funciones puras, probadas) =================== */

function currentKm(data, manual) {
  var m = Number(manual) || 0;
  ['servicios', 'gasolina', 'fallas'].forEach(function (k) {
    (data[k] || []).forEach(function (r) { var v = Number(r.km) || 0; if (v > m) m = v; });
  });
  return m;
}

function parseDate_(s) {
  if (s instanceof Date) return s;
  var p = String(s).split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function addMonths_(d, n) {
  var r = new Date(d.getTime());
  var day = r.getDate();
  r.setMonth(r.getMonth() + n);
  if (r.getDate() < day) r.setDate(0);
  return r;
}

function fmtDate_(d) {
  var m = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}

/** Promedio de km recorridos por día según las cargas de gasolina (últimos ~90 días). */
function kmPorDia(gas) {
  var g = (gas || []).filter(function (r) { return r.fecha && Number(r.km); })
    .map(function (r) { return { d: parseDate_(r.fecha), km: Number(r.km) }; })
    .sort(function (a, b) { return a.d - b.d; });
  if (g.length < 2) return 0;
  var last = g[g.length - 1];
  var first = g[0];
  for (var i = g.length - 1; i >= 0; i--) { if ((last.d - g[i].d) / 864e5 <= 90) first = g[i]; }
  var days = (last.d - first.d) / 864e5;
  if (days < 1) return 0;
  return (last.km - first.km) / days;
}

/**
 * Estado de cada tipo de servicio: toma el registro más reciente de cada tipo que tenga intervalo.
 * etapa: 'ok' | 'previo' | 'vencido'
 */
function estadoServicios(servicios, kmActual, kmDia, hoy, avisoKm, avisoDias) {
  var ultimo = {};
  (servicios || []).forEach(function (s) {
    if (!s.intervalo_km && !s.intervalo_meses) return;
    var t = s.tipo || 'otro';
    var key = t === 'otro' ? 'otro:' + (s.descripcion || '') : t;
    var prev = ultimo[key];
    if (!prev || Number(s.km) > Number(prev.km) || (Number(s.km) === Number(prev.km) && String(s.fecha) > String(prev.fecha))) ultimo[key] = s;
  });
  var hoy0 = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  return Object.keys(ultimo).map(function (key) {
    var s = ultimo[key];
    var r = { id: s.id, tipo: s.tipo, nombre: s.tipo === 'otro' ? (s.descripcion || 'Otro') : (TIPOS_SERVICIO[s.tipo] || s.tipo),
      ultimo_km: Number(s.km), ultima_fecha: s.fecha, intervalo_km: Number(s.intervalo_km) || 0, intervalo_meses: Number(s.intervalo_meses) || 0 };
    var vidaKm = 1, vidaT = 1;
    if (r.intervalo_km) {
      r.prox_km = r.ultimo_km + r.intervalo_km;
      r.km_restantes = r.prox_km - kmActual;
      vidaKm = r.km_restantes / r.intervalo_km;
    }
    if (r.intervalo_meses && s.fecha) {
      var f0 = parseDate_(s.fecha);
      var due = addMonths_(f0, r.intervalo_meses);
      r.prox_fecha = Utilities_formatISO_(due);
      r.prox_fecha_txt = fmtDate_(due);
      r.dias_restantes = Math.round((due - hoy0) / 864e5);
      vidaT = r.dias_restantes / Math.max(1, (due - f0) / 864e5);
    }
    if (r.intervalo_km && kmDia > 0) {
      r.fecha_estimada_km = fmtDate_(new Date(hoy0.getTime() + Math.max(0, r.km_restantes) / kmDia * 864e5));
    }
    r.vida = Math.max(0, Math.min(1, Math.min(vidaKm, vidaT)));
    var vencido = (r.intervalo_km && r.km_restantes <= 0) || (r.intervalo_meses && r.dias_restantes <= 0);
    var previo = (r.intervalo_km && r.km_restantes <= avisoKm) || (r.intervalo_meses && r.dias_restantes <= avisoDias);
    r.etapa = vencido ? 'vencido' : (previo ? 'previo' : 'ok');
    r.aviso_enviado = s.aviso_enviado || '';
    r.canales = { push: s.avisar_push === true || s.avisar_push === 'TRUE', wa: s.avisar_wa === true || s.avisar_wa === 'TRUE', mail: s.avisar_mail === true || s.avisar_mail === 'TRUE' };
    return r;
  }).sort(function (a, b) { return a.vida - b.vida; });
}

function Utilities_formatISO_(d) {
  var mm = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + mm + '-' + dd;
}

/** km/L entre tanques llenos (las cargas parciales se suman a la siguiente llena). */
function estadisticasGasolina(gas) {
  var g = (gas || []).map(function (r) {
    return { id: r.id, fecha: r.fecha, km: Number(r.km), litros: Number(r.litros), total: Number(r.total), precio: Number(r.precio_litro), lleno: r.lleno === true || r.lleno === 'TRUE' || r.lleno === 'true' };
  }).filter(function (r) { return r.km > 0; }).sort(function (a, b) { return a.km - b.km; });
  var puntos = [];
  var prevFull = null, litrosAcum = 0, costoAcum = 0;
  g.forEach(function (r) {
    if (prevFull === null) { if (r.lleno) prevFull = r; return; }
    litrosAcum += r.litros; costoAcum += r.total;
    if (r.lleno) {
      var dist = r.km - prevFull.km;
      if (dist > 0 && litrosAcum > 0) puntos.push({ id: r.id, fecha: r.fecha, km: r.km, kml: +(dist / litrosAcum).toFixed(2), costo_km: +(costoAcum / dist).toFixed(2), precio: r.precio });
      prevFull = r; litrosAcum = 0; costoAcum = 0;
    }
  });
  var ult = puntos.slice(-10);
  var prom = ult.length ? ult.reduce(function (a, p) { return a + p.kml; }, 0) / ult.length : 0;
  var cpk = ult.length ? ult.reduce(function (a, p) { return a + p.costo_km; }, 0) / ult.length : 0;
  return { puntos: puntos, promedio_kml: +prom.toFixed(2), costo_km: +cpk.toFixed(2) };
}



/* ======================= DATOS DE APOYO ======================= */
var PRESETS = { aceite: [8000, 6], llantas: [10000, 0], frenos: [20000, 0], filtro_aire: [24000, 24], liquido_frenos: [0, 24], bujias: [50000, 0], bateria: [0, 36], anticongelante: [50000, 36], transmision: [80000, 0], alineacion: [15000, 12], otro: [0, 0] };
var DTC = {
  P0011: 'Sincronización del árbol de levas de admisión avanzada (banco 1)', P0016: 'Correlación cigüeñal / árbol de levas (banco 1)',
  P0101: 'Sensor MAF fuera de rango', P0113: 'Sensor de temperatura del aire de admisión, señal alta', P0128: 'El motor tarda en llegar a temperatura (termostato)',
  P0131: 'Sensor de oxígeno 1, voltaje bajo', P0171: 'Mezcla muy pobre (banco 1)', P0172: 'Mezcla muy rica (banco 1)', P0174: 'Mezcla muy pobre (banco 2)',
  P0300: 'Falla de encendido aleatoria', P0301: 'Falla de encendido cilindro 1', P0302: 'Falla de encendido cilindro 2', P0303: 'Falla de encendido cilindro 3', P0304: 'Falla de encendido cilindro 4',
  P0401: 'Flujo insuficiente de EGR', P0420: 'Eficiencia del catalizador baja (banco 1)', P0440: 'Sistema EVAP con falla', P0442: 'Fuga pequeña en sistema EVAP',
  P0446: 'Control de ventilación EVAP', P0455: 'Fuga grande en sistema EVAP (revisa el tapón de gasolina)', P0456: 'Fuga muy pequeña en sistema EVAP',
  P0506: 'Ralentí más bajo de lo esperado', P0507: 'Ralentí más alto de lo esperado', P0562: 'Voltaje del sistema bajo', P0700: 'Falla en el sistema de la transmisión',
  P2135: 'Correlación de sensores del acelerador', U0100: 'Sin comunicación con la computadora del motor'

function D() {
  var d = S.data, cfg = d.config || {};
  var km = currentKm(d, Number(cfg.odometro_manual) || 0);
  var est = estadoServicios(d.servicios, km, kmPorDia(d.gasolina), new Date(), Number(cfg.aviso_km_antes) || 1000, Number(cfg.aviso_dias_antes) || 14);
  var comb = estadisticasGasolina(d.gasolina);
  var mes = todayISO().slice(0, 7);
  var gastoMes = 0;
  d.gasolina.forEach(function (g) { if (String(g.fecha).slice(0, 7) === mes) gastoMes += Number(g.total) || 0; });
  d.servicios.forEach(function (s) { if (String(s.fecha).slice(0, 7) === mes) gastoMes += Number(s.costo) || 0; });
  var abiertas = d.fallas.filter(function (f) { return f.estado !== 'resuelta'; });
  var alertas = est.filter(function (e) { return e.etapa !== 'ok'; });
  return { cfg: cfg, km: km, est: est, comb: comb, gastoMes: gastoMes, abiertas: abiertas, alertas: alertas };
}
function lifeColor(v) { return v < 0.2 ? '#C8102E' : '#1747C9'; }
function leftText(e) {
  var parts = [];
  if (e.intervalo_km) parts.push(e.km_restantes > 0 ? num(e.km_restantes) + ' km' : 'pasado ' + num(-e.km_restantes) + ' km');
  else if (e.intervalo_meses) parts.push(e.dias_restantes > 0 ? (e.dias_restantes > 60 ? Math.round(e.dias_restantes / 30) + ' meses' : e.dias_restantes + ' días') : 'vencido');
  return parts.join(' · ');
}

function api(action, data) {
  return fetch(S.conn.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: S.conn.token, data: data || {} }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error'); return j.data; });
}
function persist() { LS.set('mg_data', S.data); LS.set('mg_queue', S.queue); }
var FLUSHING = null;
function flushQueue() {
  if (!remote() || !S.queue.length) return Promise.resolve();
  if (FLUSHING) return FLUSHING;
  var next = function () {
    if (!S.queue.length) return Promise.resolve();
    var op = S.queue[0];
    return api(op.a, op.d).then(function () { S.queue.shift(); persist(); return next(); }, function (e) {
      if (e instanceof TypeError) throw e; // sin señal: se queda en la cola
      S.queue.shift(); persist(); toast('No se guardó en la hoja: ' + e.message); return next();
    });
  };
  FLUSHING = next().then(function (r) { FLUSHING = null; return r; }, function (e) { FLUSHING = null; throw e; });
  return FLUSHING;
}
function sync(silent) {
  if (!remote()) { render(); return Promise.resolve(); }
  S.busy = true; if (!silent) render();
  return flushQueue().then(function () { return api('all'); }).then(function (d) {
    S.data = { config: d.config, servicios: d.servicios, gasolina: d.gasolina, fallas: d.fallas, tiendas: d.tiendas };
    persist(); S.busy = false; render();
  }).catch(function (e) { S.busy = false; render(); if (!silent) toast('Sin conexión: ' + e.message); });
}
var KIND = { saveService: 'servicios', saveFuel: 'gasolina', saveFault: 'fallas', saveStore: 'tiendas', deleteService: 'servicios', deleteFuel: 'gasolina', deleteFault: 'fallas', deleteStore: 'tiendas' };
function mutate(action, obj) {
  var k = KIND[action];
  if (k) {
    var arr = S.data[k];
    var i = arr.findIndex(function (x) { return String(x.id) === String(obj.id); });
    if (action.indexOf('delete') === 0) { if (i >= 0) arr.splice(i, 1); }
    else { if (!obj.id) obj.id = uid(); if (i >= 0) arr[i] = obj; else arr.push(obj); }
  } else if (action === 'saveConfig') {
    Object.keys(obj).forEach(function (key) { S.data.config[key] = obj[key]; });
  }
  persist(); render();
  if (remote()) {
    S.queue.push({ a: action, d: obj }); persist();
    flushQueue().catch(function () { toast('Guardado en el teléfono; se sube cuando haya señal'); });
  }
}

function lineChart(vals, labels) {
  var W = 320, H = 150, pad = 26, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max - min < 0.5) { max += 0.25; min -= 0.25; }
  var x = function (i) { return pad + i * (W - pad - 8) / (vals.length - 1); };
  var y = function (v) { return 12 + (max - v) / (max - min) * (H - 40); };
  var p = vals.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
  var area = 'M' + x(0) + ',' + (H - 28) + ' L' + p.replace(/ /g, ' L') + ' L' + x(vals.length - 1) + ',' + (H - 28) + ' Z';
  var g = [max, (max + min) / 2, min].map(function (v) { return '<line x1="' + pad + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E7ECF4"/><text x="0" y="' + (y(v) + 4) + '" font-size="10" fill="#5A6B85" font-family="Manrope">' + v.toFixed(1) + '</text>'; }).join('');
  var lx = [0, Math.floor((vals.length - 1) / 2), vals.length - 1].map(function (i) { return '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" fill="#5A6B85" text-anchor="' + (i === 0 ? 'start' : i === vals.length - 1 ? 'end' : 'middle') + '" font-family="Manrope">' + esc(labels[i]) + '</text>'; }).join('');
  var lv = vals[vals.length - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Tendencia"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1747C9" stop-opacity=".18"/><stop offset="1" stop-color="#1747C9" stop-opacity="0"/></linearGradient></defs>' + g + '<path d="' + area + '" fill="url(#ga)"/><polyline points="' + p + '" fill="none" stroke="#1747C9" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + x(vals.length - 1) + '" cy="' + y(lv) + '" r="5" fill="#1747C9" stroke="#fff" stroke-width="2"/>' + lx + '</svg>';
}

function pickPhoto(file) {
  if (!file) return;
  toast('Procesando foto…');
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var max = 1100, s = Math.min(1, max / Math.max(img.width, img.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(function (blob) {
      removeBg(blob).then(function (out) { return blobToDataUrl(out); }, function () { toast('No se pudo quitar el fondo; uso la foto tal cual'); return blobToDataUrl(blob); })
        .then(function (dataUrl) { return trimTransparent(dataUrl); })
        .then(function (dataUrl) {
          S.photo = dataUrl; LS.set('mg_photo', dataUrl); render(); toast('Foto lista');
          if (remote()) api('savePhoto', { dataUrl: dataUrl }).catch(function () { toast('La foto quedó en el teléfono; no se pudo subir'); });
        });
    }, 'image/png');
  };
  img.src = url;
}
function removeBg(blob) {
  return import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1/+esm').then(function (m) {
    var fn = m.removeBackground || (m.default && m.default.removeBackground) || m.default;
    return fn(blob, { output: { format: 'image/png' } });
  });
}
function blobToDataUrl(b) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.readAsDataURL(b); }); }
function trimTransparent(dataUrl) {
  return new Promise(function (res) {
    var im = new Image(); im.onload = function () {
      var cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height; var cx = cv.getContext('2d'); cx.drawImage(im, 0, 0);
      var d = cx.getImageData(0, 0, cv.width, cv.height).data, x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0, any = false;
      for (var y = 0; y < cv.height; y += 2) for (var x = 0; x < cv.width; x += 2) if (d[(y * cv.width + x) * 4 + 3] > 20) { any = true; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (!any || (x1 - x0) > cv.width * 0.98 && (y1 - y0) > cv.height * 0.98) { res(toWebp(cv)); return; }
      var o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; o.getContext('2d').drawImage(cv, x0, y0, o.width, o.height, 0, 0, o.width, o.height); res(toWebp(o));
    }; im.src = dataUrl;
  });
}
function toWebp(cv) { var u = cv.toDataURL('image/webp', 0.86); return u.indexOf('data:image/webp') === 0 ? u : cv.toDataURL('image/png'); }

/* ======================= OBD-II (Web Bluetooth, ELM327 BLE) ======================= */
var OBD = { dev: null, rx: null, tx: null, buf: '', waiter: null, chain: Promise.resolve(), running: false };
function obdConnect() {
  S.obd.status = 'conn'; render();
  navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [0xfff0, 0xffe0, 0x18f0, 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'] })
    .then(function (dev) { OBD.dev = dev; dev.addEventListener('gattserverdisconnected', function () { OBD.running = false; S.obd.status = 'off'; if (S.view === 'obd') render(); }); return dev.gatt.connect(); })
    .then(function (srv) { return srv.getPrimaryServices(); })
    .then(function (svcs) {
      return svcs.reduce(function (p, s) {
        return p.then(function () {
          if (OBD.rx && OBD.tx) return;
          return s.getCharacteristics().then(function (cs) {
            var rx = null, tx = null;
            cs.forEach(function (c) { if (!rx && (c.properties.notify || c.properties.indicate)) rx = c; if (!tx && (c.properties.write || c.properties.writeWithoutResponse)) tx = c; });
            if (rx && tx) { OBD.rx = rx; OBD.tx = tx; }
          }).catch(function () {});
        });
      }, Promise.resolve());
    })
    .then(function () {
      if (!OBD.rx) throw new Error('El lector no expone el servicio esperado');
      OBD.rx.addEventListener('characteristicvaluechanged', function (ev) {
        OBD.buf += new TextDecoder().decode(ev.target.value);
        if (OBD.buf.indexOf('>') >= 0 && OBD.waiter) { var w = OBD.waiter; OBD.waiter = null; var out = OBD.buf.replace('>', ''); OBD.buf = ''; w(out); }
      });
      return OBD.rx.startNotifications();
    })
    .then(function () { return ['ATZ', 'ATE0', 'ATL0', 'ATS0', 'ATH0', 'ATSP0'].reduce(function (p, c) { return p.then(function () { return obdCmd(c, c === 'ATZ' ? 4000 : 2000); }); }, Promise.resolve()); })
    .then(function () { return obdCmd('0100', 12000); })
    .then(function (r) {
      if (/UNABLE|ERROR|NO DATA/i.test(r)) toast('El lector respondió pero no ve la computadora del motor. ¿Llave en ON?');
      S.obd.status = 'on'; render(); obdLoop();
    })
    .catch(function (e) { S.obd.status = e && e.name === 'NotFoundError' ? 'off' : 'err'; render(); if (e && e.name !== 'NotFoundError') toast('OBD: ' + e.message); });
}
function obdCmd(cmd, timeout) {
  OBD.chain = OBD.chain.then(function () {
    return new Promise(function (res) {
      var t = setTimeout(function () { OBD.waiter = null; var b = OBD.buf; OBD.buf = ''; res(b + ' TIMEOUT'); }, timeout || 2500);
      OBD.waiter = function (txt) { clearTimeout(t); res(txt); };
      var bytes = new TextEncoder().encode(cmd + '\r');
      var w = OBD.tx.properties.writeWithoutResponse && OBD.tx.writeValueWithoutResponse ? OBD.tx.writeValueWithoutResponse(bytes) : OBD.tx.writeValue(bytes);
      w.catch(function () {});
    });
  });
  return OBD.chain;
}
function pidBytes(resp, pid) {
  var clean = String(resp).toUpperCase().replace(/SEARCHING\.\.\./g, '').replace(/[^0-9A-F\r\n]/g, '');
  var lines = clean.split(/[\r\n]+/);
  for (var i = 0; i < lines.length; i++) {
    var k = lines[i].indexOf('41' + pid);
    if (k >= 0) { var hex = lines[i].slice(k + 4), b = []; for (var j = 0; j + 1 < hex.length; j += 2) b.push(parseInt(hex.substr(j, 2), 16)); return b; }
  }
  return null;
}
var PIDS = [
  ['0C', 'rpm', function (b) { return (b[0] * 256 + b[1]) / 4; }], ['05', 'temp', function (b) { return b[0] - 40; }],
  ['04', 'carga', function (b) { return b[0] * 100 / 255; }], ['07', 'ltft', function (b) { return (b[0] - 128) * 100 / 128; }],
  ['0F', 'iat', function (b) { return b[0] - 40; }], ['0D', 'vel', function (b) { return b[0]; }]
];
function obdLoop() {
  if (OBD.running) return; OBD.running = true;
  var step = function () {
    if (!OBD.running) return;
    PIDS.reduce(function (p, d) {
      return p.then(function () { return obdCmd('01' + d[0], 1500).then(function (r) { var b = pidBytes(r, d[0]); if (b && b.length) S.obd.live[d[1]] = d[2](b); }); });
    }, Promise.resolve())
      .then(function () { return obdCmd('ATRV', 1500).then(function (r) { var m = String(r).match(/(\d+(\.\d+)?)\s*V/i); if (m) S.obd.live.volt = parseFloat(m[1]); }); })
      .then(function () { if (S.view === 'obd' && !document.querySelector('.sheet')) render(); setTimeout(step, 800); });
  };
  step();
}
function parseDtcs(resp) {
  var hex = String(resp).toUpperCase().replace(/SEARCHING\.\.\./g, '').replace(/[^0-9A-F\r\n]/g, '');
  var codes = [];
  hex.split(/[\r\n]+/).forEach(function (line) {
    var k = line.indexOf('43'); if (k < 0) return;
    var d = line.slice(k + 2);
    if (d.length % 4 === 2) d = d.slice(2);
    for (var i = 0; i + 3 < d.length; i += 4) {
      var w = d.substr(i, 4); if (w === '0000') continue;
      var n = parseInt(w[0], 16);
      codes.push('PCBU'[n >> 2] + (n & 3) + w.slice(1));
    }
  });
  return codes.filter(function (c, i) { return codes.indexOf(c) === i; });
}
function obdReadDtc() { obdCmd('03', 5000).then(function (r) { S.obd.dtcs = parseDtcs(r); render(); }); }
function obdClear() { if (!confirm('¿Borrar los códigos y apagar el check engine? Si la falla sigue, el código regresa.')) return; obdCmd('04', 5000).then(function () { S.obd.dtcs = []; toast('Códigos borrados'); render(); }); }
function obdDisconnect() { OBD.running = false; try { OBD.dev.gatt.disconnect(); } catch (e) {} OBD.rx = OBD.tx = null; S.obd.status = 'off'; render(); }
